# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rdkb-bsp"
BBFILE_PATTERN_rdkb-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_rdkb-bsp = "6"

LAYERDEPENDS_rdkb-bsp = "core"
LAYERSERIES_COMPAT_rdkb-bsp = "wrynose"

